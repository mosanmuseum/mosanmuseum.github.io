<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>박형오 | Constructed Being : 구축된 존재</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:#171717}
body{font-family:Arial,"Noto Sans KR",sans-serif}
a{color:inherit}
.site{width:min(100%,760px);margin:0 auto;padding:34px 22px 60px}
.museum{text-align:center;font-size:10px;letter-spacing:.24em;color:#777;margin:2px 0 34px;text-transform:uppercase}
.section{padding:0 0 58px;margin:0 0 58px;border-bottom:1px solid #e6e6e6}
.section:last-child{border-bottom:0;margin-bottom:0}
.artwork{width:100%;height:auto;display:block;margin:0 auto 24px}
.artist{font-size:13px;letter-spacing:.12em;margin:0 0 7px}
.title{font-size:25px;font-weight:400;letter-spacing:-.02em;margin:0 0 28px}
.sound-label{font-size:10px;letter-spacing:.22em;color:#777;margin:0 0 10px;text-transform:uppercase}
audio{display:block;width:100%;height:42px}
.credit{font-size:10px;color:#888;margin-top:12px;letter-spacing:.04em}
.intro{text-align:center;margin:-8px 0 38px;color:#888;font-size:11px;letter-spacing:.08em}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 36px}
.nav a{font-size:10px;text-decoration:none;border:1px solid #ddd;padding:7px 10px;color:#555}
.footer{text-align:center;font-size:9px;letter-spacing:.14em;color:#aaa;margin-top:36px}
@media(max-width:520px){
  .site{padding:24px 16px 44px}
  .title{font-size:23px}
}
</style></head>
<body><main class="site">
<div class="museum">MOSAN CONTEMPORARY ART MUSEUM</div>
<section class="section">
<img class="artwork" src="park-hyung-o.jpg" alt="박형오 작품 이미지">
<p class="artist">박형오</p>
<h1 class="title">Constructed Being : 구축된 존재</h1>
<div class="sound-label">Exhibition Sound</div>
<audio controls preload="metadata"><source src="park-hyung-o.mp3" type="audio/mpeg">브라우저에서 오디오 재생을 지원하지 않습니다.</audio>
<div class="credit">Quiet Nostalgia</div>
</section>
<div class="footer">MOSAN CONTEMPORARY ART MUSEUM</div>
</main></body></html>
