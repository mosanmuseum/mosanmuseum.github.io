<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>윤유담 | Constructed Relation</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#171717;font-family:Arial,"Noto Sans KR",sans-serif}
main{max-width:760px;margin:auto;padding:38px 24px 60px}
.museum{font-size:10px;letter-spacing:.22em;color:#777;text-align:center;margin-bottom:42px}
.artwork{width:100%;display:block;margin:0 auto 34px}
.artist{font-size:14px;letter-spacing:.08em;margin-bottom:7px}
.title{font-size:22px;font-weight:400;margin:0 0 4px}
.subtitle{font-size:11px;color:#888;letter-spacing:.04em;margin-bottom:42px}
.section{font-size:10px;letter-spacing:.2em;color:#777;margin-bottom:18px}
.sound{border-top:1px solid #ddd;padding:18px 0 22px}
.sound-title{font-size:13px;margin-bottom:10px}
audio{width:100%}
</style>
</head>
<body>
<main>
<div class="museum">MOSAN CONTEMPORARY ART MUSEUM</div>
<img class="artwork" src="yoon-yudam.jpg" alt="윤유담 작품">
<div class="artist">윤유담</div>
<h1 class="title">구축된 관계</h1>
<div class="subtitle">Constructed Relation</div>
<div class="section">EXHIBITION SOUND</div>

<div class="sound">
  <div class="sound-title">비현실적 잔향</div>
  <audio controls preload="none">
    <source src="yoon-yudam.mp3" type="audio/mpeg">
  </audio>
</div>

<div class="sound">
  <div class="sound-title">시선</div>
  <audio controls preload="none">
    <source src="yoon-yudam-2.mp3" type="audio/mpeg">
  </audio>
</div>
</main>
</body>
</html>
